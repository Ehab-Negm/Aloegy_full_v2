# Basic Egyptian takeaway flows — order capture, contact, confirmation handoff.
menu: &menu
  - {name: "برجر كبير", price: 45.0, available: true}
  - {name: "برجر صغير", price: 30.0, available: true}
  - {name: "بطاطس", price: 20.0, available: true}
  - {name: "كولا", price: 15.0, available: true}
  - {name: "كشري كبير", price: 35.0, available: true}
  - {name: "شاورما فراخ", price: 50.0, available: true}
  - {name: "ميه", price: 5.0, available: true}

scenarios:
  - name: takeaway_simple_burger
    menu: *menu
    turns:
      - user: "تيكاواي لو سمحت"
        expect: {intent: takeaway}
      - user: "عايز برجر كبير وكولا"
        expect: {order_items: {"برجر كبير": 1, "كولا": 1}}
      - user: "اسمي أحمد"
        expect: {name: "أحمد"}
      - user: "01012345678"
        expect: {phone: "01012345678"}

  - name: takeaway_quantity_variants
    menu: *menu
    turns:
      - user: "هاتلي اتنين برجر كبير"
        expect: {order_items: {"برجر كبير": 2}}
      - user: "وكولا تلاته"
        expect: {order_items: {"برجر كبير": 2, "كولا": 3}}

  - name: takeaway_arabic_indic_digits
    menu: *menu
    turns:
      - user: "٢ كشري كبير و٣ كولا"
        expect: {order_items: {"كشري كبير": 2, "كولا": 3}}

  - name: takeaway_definite_article
    menu: *menu
    turns:
      - user: "البرجر الكبير اتنين"
        expect: {order_items: {"برجر كبير": 2}}
      - user: "والبطاطس"
        expect: {order_items: {"برجر كبير": 2, "بطاطس": 1}}

  - name: takeaway_multipliers
    menu: *menu
    turns:
      - user: "برجر كبير × 2"
        expect: {order_items: {"برجر كبير": 2}}
      - user: "بطاطس * 3"
        expect: {order_items: {"برجر كبير": 2, "بطاطس": 3}}

  - name: takeaway_aggregation_dedup
    menu: *menu
    turns:
      - user: "كولا"
        expect: {order_items: {"كولا": 1}}
      - user: "وكولا كمان"
        expect: {order_items: {"كولا": 2}}

  - name: takeaway_alias_support
    menu: *menu
    turns:
      - user: "هاتلي بيبسي"
        expect: {order_items: {"كولا": 1}}
      - user: "وفرايز"
        expect: {order_items: {"كولا": 1, "بطاطس": 1}}

  - name: takeaway_intent_variants
    menu: *menu
    turns:
      - user: "هاجي استلمه"
        expect: {intent: takeaway}
      - user: "اخده من المحل"
        expect: {intent: takeaway}

  - name: takeaway_long_filler_turn
    menu: *menu
    turns:
      - user: "اممم يعني كده، عايز برجر كبير اتنين وبطاطس وكولا، تمام؟"
        expect: {order_items: {"برجر كبير": 2, "بطاطس": 1, "كولا": 1}}
