# Order mutation scenarios — add / replace / remove / increase / decrease / keep.
menu: &menu
  - {name: "برجر كبير", price: 45.0, available: true}
  - {name: "بطاطس", price: 20.0, available: true}
  - {name: "كولا", price: 15.0, available: true}

scenarios:
  - name: mutation_add_after_initial
    menu: *menu
    turns:
      - user: "برجر كبير"
        expect: {order_items: {"برجر كبير": 1}}
      - user: "ضيفلي معاه كولا"
        expect: {mutation: add, order_items: {"برجر كبير": 1, "كولا": 1}}

  - name: mutation_replace_clears_order
    menu: *menu
    turns:
      - user: "برجر كبير وكولا"
        expect: {order_items: {"برجر كبير": 1, "كولا": 1}}
      - user: "لأ غير الطلب، اعمله بطاطس وكولا"
        expect: {mutation: replace, order_items: {"بطاطس": 1, "كولا": 1}}

  - name: mutation_keep_signal
    menu: *menu
    turns:
      - user: "برجر كبير وبطاطس"
        expect: {order_items: {"برجر كبير": 1, "بطاطس": 1}}
      - user: "خليه كده تمام"
        expect: {mutation: keep, order_items: {"برجر كبير": 1, "بطاطس": 1}}

  - name: mutation_remove_item_signal
    menu: *menu
    turns:
      - user: "برجر كبير وكولا وبطاطس"
        expect: {order_items: {"برجر كبير": 1, "كولا": 1, "بطاطس": 1}}
      - user: "شيل الكولا"
        expect: {mutation: remove}

  - name: mutation_balash_for_remove
    menu: *menu
    turns:
      - user: "برجر كبير"
        expect: {order_items: {"برجر كبير": 1}}
      - user: "بلاش بطاطس"
        expect: {mutation: remove}
