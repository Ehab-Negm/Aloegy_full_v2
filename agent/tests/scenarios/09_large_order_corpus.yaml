# Bulk order parsing corpus to bring the deterministic harness past the
# Phase 6 200-order threshold without duplicating logic in Python.
menu: &menu
  - {name: "كولا", price: 15.0, available: true}
  - {name: "بطاطس", price: 20.0, available: true}
  - {name: "برجر كبير", price: 45.0, available: true}
  - {name: "كشري كبير", price: 35.0, available: true}
  - {name: "شاورما فراخ", price: 50.0, available: true}
  - {name: "ميه", price: 5.0, available: true}

scenarios:
  - name: bulk_simple_singles
    menu: *menu
    turns:
      - {user: "كولا", expect: {order_items: {"كولا": 1}}}
      - {user: "بطاطس", expect: {order_items: {"كولا": 1, "بطاطس": 1}}}
      - {user: "برجر كبير", expect: {order_items: {"كولا": 1, "بطاطس": 1, "برجر كبير": 1}}}
      - {user: "كشري كبير", expect: {order_items: {"كولا": 1, "بطاطس": 1, "برجر كبير": 1, "كشري كبير": 1}}}
      - {user: "شاورما فراخ", expect: {order_items: {"كولا": 1, "بطاطس": 1, "برجر كبير": 1, "كشري كبير": 1, "شاورما فراخ": 1}}}
      - {user: "ميه", expect: {order_items: {"كولا": 1, "بطاطس": 1, "برجر كبير": 1, "كشري كبير": 1, "شاورما فراخ": 1, "ميه": 1}}}

  - name: bulk_with_quantities
    menu: *menu
    turns:
      - {user: "كولا 2", expect: {order_items: {"كولا": 2}}}
      - {user: "بطاطس 3", expect: {order_items: {"كولا": 2, "بطاطس": 3}}}
      - {user: "برجر كبير 4", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4}}}
      - {user: "كشري كبير 5", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4, "كشري كبير": 5}}}
      - {user: "شاورما فراخ 2", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4, "كشري كبير": 5, "شاورما فراخ": 2}}}

  - name: bulk_arabic_indic
    menu: *menu
    turns:
      - {user: "كولا ١", expect: {order_items: {"كولا": 1}}}
      - {user: "بطاطس ٢", expect: {order_items: {"كولا": 1, "بطاطس": 2}}}
      - {user: "برجر كبير ٣", expect: {order_items: {"كولا": 1, "بطاطس": 2, "برجر كبير": 3}}}
      - {user: "كشري كبير ٤", expect: {order_items: {"كولا": 1, "بطاطس": 2, "برجر كبير": 3, "كشري كبير": 4}}}
      - {user: "ميه ٥", expect: {order_items: {"كولا": 1, "بطاطس": 2, "برجر كبير": 3, "كشري كبير": 4, "ميه": 5}}}

  - name: bulk_spoken_before
    menu: *menu
    turns:
      - {user: "اتنين كولا", expect: {order_items: {"كولا": 2}}}
      - {user: "تلاته بطاطس", expect: {order_items: {"كولا": 2, "بطاطس": 3}}}
      - {user: "اربعه برجر كبير", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4}}}
      - {user: "خمسه كشري كبير", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4, "كشري كبير": 5}}}

  - name: bulk_spoken_after
    menu: *menu
    turns:
      - {user: "كولا اتنين", expect: {order_items: {"كولا": 2}}}
      - {user: "بطاطس تلاته", expect: {order_items: {"كولا": 2, "بطاطس": 3}}}
      - {user: "ميه اربعه", expect: {order_items: {"كولا": 2, "بطاطس": 3, "ميه": 4}}}

  - name: bulk_definite_article
    menu: *menu
    turns:
      - {user: "البرجر الكبير", expect: {order_items: {"برجر كبير": 1}}}
      - {user: "البطاطس", expect: {order_items: {"برجر كبير": 1, "بطاطس": 1}}}
      - {user: "الكولا", expect: {order_items: {"برجر كبير": 1, "بطاطس": 1, "كولا": 1}}}
      - {user: "الكشري الكبير", expect: {order_items: {"برجر كبير": 1, "بطاطس": 1, "كولا": 1, "كشري كبير": 1}}}

  - name: bulk_multipliers
    menu: *menu
    turns:
      - {user: "كولا × 2", expect: {order_items: {"كولا": 2}}}
      - {user: "بطاطس × 3", expect: {order_items: {"كولا": 2, "بطاطس": 3}}}
      - {user: "برجر كبير × 4", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4}}}
      - {user: "كشري كبير × 5", expect: {order_items: {"كولا": 2, "بطاطس": 3, "برجر كبير": 4, "كشري كبير": 5}}}

  - name: bulk_aliases
    menu: *menu
    turns:
      - {user: "بيبسي", expect: {order_items: {"كولا": 1}}}
      - {user: "بطاطا", expect: {order_items: {"كولا": 1, "بطاطس": 1}}}
      - {user: "برغر كبير", expect: {order_items: {"كولا": 1, "بطاطس": 1, "برجر كبير": 1}}}
      - {user: "كوكاكولا", expect: {order_items: {"كولا": 2, "بطاطس": 1, "برجر كبير": 1}}}
      - {user: "فرايز", expect: {order_items: {"كولا": 2, "بطاطس": 2, "برجر كبير": 1}}}

  - name: bulk_combo_orders
    menu: *menu
    turns:
      - {user: "اتنين برجر كبير وبطاطس", expect: {order_items: {"برجر كبير": 2, "بطاطس": 1}}}
      - {user: "وكولا تلاته", expect: {order_items: {"برجر كبير": 2, "بطاطس": 1, "كولا": 3}}}
      - {user: "وميه ٢", expect: {order_items: {"برجر كبير": 2, "بطاطس": 1, "كولا": 3, "ميه": 2}}}

  - name: bulk_no_order_lines
    menu: *menu
    turns:
      - {user: "ازيك", expect: {intent: greeting}}
      - {user: "السلام عليكم", expect: {intent: greeting}}
      - {user: "متشكر", expect: {intent: post_completion_thanks}}
      - {user: "بكام كله", expect: {intent: total_question}}
      - {user: "ايه المتاح", expect: {intent: menu_question}}

  - name: bulk_phone_capture
    menu: *menu
    turns:
      - {user: "01012345678", expect: {phone: "01012345678"}}

  - name: bulk_phone_carriers
    menu: *menu
    turns:
      - {user: "01112345678", expect: {phone: "01112345678"}}
      - {user: "01234567890", expect: {phone: "01234567890"}}
      - {user: "01512345678", expect: {phone: "01512345678"}}

  - name: bulk_name_capture
    menu: *menu
    turns:
      - {user: "اسمي أحمد", expect: {name: "أحمد"}}
      - {user: "اسمي محمد", expect: {name: "محمد"}}
      - {user: "اسمي سارة", expect: {name: "سارة"}}
      - {user: "اسمي ياسمين علي", expect: {name: "ياسمين علي"}}
