# Delivery flows: address detection, zone matching, mid-order changes.
menu: &menu
  - {name: "برجر كبير", price: 45.0, available: true}
  - {name: "برجر صغير", price: 30.0, available: true}
  - {name: "بطاطس", price: 20.0, available: true}
  - {name: "كولا", price: 15.0, available: true}
  - {name: "بيتزا مارجريتا", price: 80.0, available: true}
  - {name: "شاورما فراخ", price: 50.0, available: true}

zones: &zones [المعادي, مدينة نصر, الزمالك, الدقي]

scenarios:
  - name: delivery_complex_order
    menu: *menu
    delivery_zones: *zones
    turns:
      - user: "عايز توصيل لو سمحت"
        expect: {intent: delivery}
      - user: "هاتلي اتنين برجر كبير وكولا"
        expect: {order_items: {"برجر كبير": 2, "كولا": 1}}
      - user: "العنوان المعادي شارع 9 برج 12"
        expect: {address_contains: "المعادي"}
      - user: "اسمي محمد"
        expect: {name: "محمد"}
      - user: "رقمي 01012345678"
        expect: {phone: "01012345678"}

  - name: delivery_replace_then_add
    menu: *menu
    delivery_zones: *zones
    turns:
      - user: "دليفري عايز برجر كبير"
        expect: {intent: delivery, order_items: {"برجر كبير": 1}}
      - user: "لأ غير الطلب، اعمله بيتزا مارجريتا"
        expect: {mutation: replace, order_items: {"بيتزا مارجريتا": 1}}
      - user: "وضيف كولا"
        expect: {mutation: add, order_items: {"بيتزا مارجريتا": 1, "كولا": 1}}

  - name: delivery_zone_question_then_order
    menu: *menu
    delivery_zones: *zones
    turns:
      - user: "بتوصلوا فين؟"
        expect: {intent: delivery_zone_question}
      - user: "في المعادي تمام"
        expect: {}
      - user: "هاتلي شاورما فراخ وبطاطس"
        expect: {order_items: {"شاورما فراخ": 1, "بطاطس": 1}}

  - name: delivery_address_chunked_over_turns
    menu: *menu
    delivery_zones: *zones
    turns:
      - user: "العنوان شارع 5"
        expect: {}
      - user: "في المعادي شارع 5 برج 3"
        expect: {address_contains: "المعادي"}

  - name: delivery_long_address
    menu: *menu
    delivery_zones: *zones
    turns:
      - user: "في الزمالك شارع 26 يوليو، عمارة 18 الدور التاني شقة 5"
        expect: {address_contains: "الزمالك"}
      - user: "هاتلي بيتزا مارجريتا"
        expect: {order_items: {"بيتزا مارجريتا": 1}}
