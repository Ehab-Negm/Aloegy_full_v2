# Complaint categorization scenarios.
scenarios:
  - name: complaint_quality_cold
    menu: []
    turns:
      - user: "عندي شكوى"
        expect: {intent: complaint}
      - user: "الأكل وصلني بارد"
        expect: {complaint_type: quality}

  - name: complaint_delivery_late
    menu: []
    turns:
      - user: "اشتكي على التوصيل"
        expect: {intent: complaint}
      - user: "اتأخر علي ساعة كاملة"
        expect: {complaint_type: delivery}

  - name: complaint_order_wrong
    menu: []
    turns:
      - user: "اشكي"
        expect: {intent: complaint}
      - user: "وصلني غلط، الطلب مش اللي طلبته"
        expect: {complaint_type: order}

  - name: complaint_service
    menu: []
    turns:
      - user: "الموظف مش محترم وأسلوبه وحش"
        expect: {intent: complaint, complaint_type: service}
