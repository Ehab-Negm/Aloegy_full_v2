# Dialogue rules — Egyptian Arabic phrases for the deterministic
# conversational layer. Edit here to tune routing/correction behaviour
# without touching code; both intent_router.py and correction_detector.py
# reload this file at module load time.
#
# All phrases are matched against ``normalize_ar(text)`` so the YAML
# values can be either normalized or natural Arabic — the matcher
# normalizes both sides.

# ─── Intent overlay (extends core.extractors.intent_extractor cues) ─────
intents:
  delivery:
    threshold: 0.85
    phrases:
      - توصيل
      - دليفري
      - delivery
      - يوصل
      - ابعتوهالي
      - وصلوهالي
      - هتوصلوا
  takeaway:
    threshold: 0.85
    phrases:
      - تيكاواي
      - takeaway
      - استلام
      - هاجي اخده
      - هاجي استلمه
      - اجي استلمه
      - هاخده من المطعم
      - اخده من المطعم
  reservation:
    threshold: 0.85
    phrases:
      - حجز
      - احجز
      - ترابيزة
      - ترابيزه
      - رزيرفيشن
      - reservation
      - احجزلي
  complaint:
    threshold: 0.85
    phrases:
      - شكوى
      - مشكلة
      - مشكله
      - اعتراض
      - complaint
      - مش راضي
      - الطلب وصل بارد

# ─── Confirmation (yes / no on a confirmation prompt) ────────────────────
confirm_yes:
  - اه
  - آه
  - ايوه
  - أيوه
  - تمام
  - ماشي
  - حلو
  - اوكي
  - أوكي
  - اكد
  - أكد
  - اكدت
  - موافق
  - "ok"
  - "yes"

confirm_no:
  - لا
  - لأ
  - مش كده
  - مش كدا
  - خطأ
  - غلط
  - "no"

# ─── Cancellation ────────────────────────────────────────────────────────
cancel:
  - الغي
  - الغى
  - الغ الطلب
  - الغي الطلب
  - الغى الطلب
  - كنسل
  - مش عايز
  - بطل الطلب
  - اوقف الطلب
  - cancel

# ─── Flow-change marker phrases (must combine with a flow target below) ──
flow_change_markers:
  - خليها
  - خلي
  - بدل ما
  - غير
  - بدل
  - اعمله
  - خله

flow_targets:
  delivery:    [توصيل, دليفري, delivery, يوصل]
  takeaway:    [تيكاواي, استلام, هاخده, takeaway, اجي اخده]
  reservation: [حجز, ترابيزه, ترابيزة, احجز]
  complaint:   [شكوى, مشكله, مشكلة]

# ─── Item modification verbs ─────────────────────────────────────────────
item_remove:
  - شيل
  - احذف
  - امسح
  - الغ
  - الغى
  - ميجبش
  - بدون
  - مش عايز
  - اشلح

item_add:
  - زود
  - كمان
  - ضيف
  - اضف
  - اضيف
  - ابعت كمان

item_replace:
  - بدل
  - غير
  - خلي بدالها
  - خلي بدالة
  - خليها بدل

# ─── Slot correction (marker + slot target) ──────────────────────────────
slot_correction_markers:
  - غلط
  - مش صح
  - مش ده
  - مش دي
  - خطأ
  - مش الرقم
  - مش العنوان
  - عدل
  - غير
  - صحح

slot_targets:
  phone:   [رقم, موبايل, تليفون, نمرة, نمره]
  address: [عنوان, مكان, بيت, شقه, شقة, العمارة]
  name:    [اسم, اسمي]
