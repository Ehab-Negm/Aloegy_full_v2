services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aloegy-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Backend uses this for both server-side LiveKit API calls AND echoes
      # it back to the browser in /demo/livekit-session. Must be the public
      # WSS URL so the browser can connect — Caddy hairpins it back to
      # 127.0.0.1:7880 on the host.
      LIVEKIT_URL: "wss://lk.aloegy.ai"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: aloegy-agent
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./agent/.runtime:/app/.runtime
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
